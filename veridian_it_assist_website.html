<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Veridian IT Assist</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    /* ---- Brand tokens (Veridian = deep green, grounded in the product name) ---- */
    --brand-950: #06211A;
    --brand-900: #0A2B21;
    --brand-700: #0B6E4F;
    --brand-600: #0E8560;
    --brand-500: #159768;
    --brand-100: #E3F3EA;
    --brand-50:  #F1F9F4;

    --canvas: #F5F7F6;
    --surface: #FFFFFF;
    --ink: #101828;
    --ink-soft: #344054;
    --slate: #667085;
    --border: #E1E6E3;
    --border-soft: #EBEEEC;

    --amber-bg:#FEF6E7; --amber-text:#93590B; --amber-border:#F7E1AE; --amber-dot:#D08700;
    --red-bg:#FDEDEC;  --red-text:#A32E23;  --red-border:#F5CFC8;  --red-dot:#C0392B;
    --green-bg:#EAF7EF; --green-text:#0B6E4F; --green-border:#BFE6D2; --green-dot:#0B6E4F;
    --blue-bg:#EAF1FB; --blue-text:#1D4E89; --blue-border:#C6DBF3; --blue-dot:#2563AC;

    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow-card: 0 1px 2px rgba(16,24,40,0.04);
  }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body {
    margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--canvas); color: var(--ink); font-size:14.5px; line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font-family: inherit; }
  code, .mono { font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }

  /* ---------- Top header ---------- */
  .topbar {
    height: 60px; background: var(--brand-950); color:#fff; display:flex; align-items:center;
    padding: 0 22px; gap: 14px; position:sticky; top:0; z-index:30;
  }
  .brandmark { display:flex; align-items:center; gap:10px; }
  .brandmark svg { flex-shrink:0; }
  .brandmark .wordmark { font-size:17px; font-weight:800; letter-spacing:-0.3px; color:#fff; }
  .brandmark .wordmark small { display:block; font-size:10.5px; font-weight:600; color:#9FD6BA; letter-spacing:.2px; margin-top:-2px;}
  .topbar-spacer { flex:1; }
  .env-pill {
    font-size:12px; font-weight:600; color:#CFEAD9; background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14); padding:5px 12px; border-radius:999px;
  }
  .user-chip {
    display:flex; align-items:center; gap:8px; padding: 4px 10px 4px 4px; border-radius:999px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  }
  .user-chip .avatar {
    width:26px; height:26px; border-radius:50%; background:var(--brand-500); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700;
  }
  .user-chip span { font-size:12.5px; font-weight:600; color:#E7F3EC; }

  /* ---------- Layout ---------- */
  .layout { display:flex; align-items:flex-start; }
  .sidebar {
    width: 232px; flex-shrink:0; background: var(--brand-900); min-height: calc(100vh - 60px);
    padding: 20px 14px; position:sticky; top:60px;
  }
  .nav { display:flex; flex-direction:column; gap:2px; }
  .nav button {
    display:flex; align-items:center; gap:10px; text-align:left; padding:10px 12px; border-radius:9px;
    border:none; background:transparent; font-size:14px; font-weight:600; cursor:pointer; color:#B9D6C8;
    width:100%;
  }
  .nav button svg { flex-shrink:0; opacity:.85; }
  .nav button:hover { background:rgba(255,255,255,0.05); color:#fff; }
  .nav button.active { background: var(--brand-700); color:#fff; }
  .nav button.active svg { opacity:1; }
  .sidebar-divider { height:1px; background:rgba(255,255,255,0.08); margin:18px 4px; }
  .sidebar-note { padding: 0 8px; }
  .sidebar-note .t { font-size:11.5px; font-weight:700; color:#8FBBA3; text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
  .sidebar-note p { font-size:12px; color:#7FA894; margin:0 0 10px; line-height:1.5; }

  .main { flex:1; padding: 30px 40px 60px; max-width: 1080px; }

  /* ---------- Dashboard header ---------- */
  .page-head { margin-bottom: 22px; }
  .page-head .eyebrow { font-size:12.5px; font-weight:700; color:var(--brand-700); margin-bottom:4px; }
  .page-head h1 { font-size:25px; font-weight:800; letter-spacing:-0.4px; margin:0 0 4px; color:var(--ink); }
  .page-head p { margin:0; color:var(--slate); font-size:14px; max-width:640px; }

  .stat-row { display:flex; gap:12px; margin: 18px 0 26px; flex-wrap:wrap; }
  .stat-card {
    flex:1; min-width:150px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px 16px; box-shadow: var(--shadow-card);
  }
  .stat-card .stat-label { font-size:12px; color:var(--slate); font-weight:600; display:flex; align-items:center; gap:6px;}
  .stat-card .stat-value { font-size:22px; font-weight:800; margin-top:6px; color:var(--ink); }
  .stat-card .stat-sub { font-size:11.5px; color:var(--slate); margin-top:2px; }

  /* ---------- Panels ---------- */
  .panel {
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-lg);
    padding: 22px 24px; box-shadow: var(--shadow-card); margin-bottom:20px;
  }
  .panel-title { font-size:15px; font-weight:700; color:var(--ink); margin:0 0 2px; display:flex; align-items:center; gap:8px;}
  .panel-sub { font-size:12.5px; color:var(--slate); margin:0 0 16px; }

  /* ---------- Sample request chips ---------- */
  .chip-scroll { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px; }
  .chip-scroll::-webkit-scrollbar { height:6px; }
  .chip-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .req-chip {
    flex-shrink:0; width: 250px; text-align:left; border:1px solid var(--border); background:var(--canvas);
    border-radius:var(--radius-md); padding:10px 12px; cursor:pointer;
  }
  .req-chip:hover { border-color: var(--brand-500); background:var(--brand-50); }
  .req-chip.active { border-color: var(--brand-700); background:var(--brand-100); }
  .req-chip .rc-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .req-chip .rc-id { font-size:11px; font-weight:700; color:var(--brand-700); }
  .req-chip .rc-emp { font-size:11px; color:var(--slate); }
  .req-chip .rc-text { font-size:12.5px; color:var(--ink-soft); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ---------- Composer ---------- */
  label.fieldLabel { font-weight:700; font-size:13px; display:block; margin-bottom:7px; margin-top:18px; color:var(--ink-soft); }
  textarea, input[type=text] {
    width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius-md); font-size:14.5px;
    font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea:focus, input[type=text]:focus, .req-chip:focus-visible, button:focus-visible {
    outline: 2px solid var(--brand-500); outline-offset:1px;
  }
  textarea { resize:vertical; }
  .composer-foot { display:flex; align-items:center; justify-content:space-between; margin-top:14px; }
  .composer-hint { font-size:12px; color:var(--slate); }
  .btn-primary {
    padding:11px 20px; border:none; border-radius:var(--radius-md);
    background: var(--brand-700); color:#fff; font-size:14px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
  }
  .btn-primary:hover { background: var(--brand-600); }
  .btn-secondary {
    padding:9px 16px; border:1px solid var(--border); border-radius:var(--radius-md); background:#fff;
    cursor:pointer; font-size:13px; font-weight:700; color:var(--ink-soft);
  }
  .btn-secondary:hover { background: var(--canvas); }
  .btn-secondary:disabled { opacity:.6; cursor:default; }
  .btn-ghost {
    padding:8px 12px; border:none; background:none; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--slate);
  }
  .btn-ghost:hover { color:var(--ink); }

  /* ---------- Badges / risk ---------- */
  .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid; }
  .badge .dot { width:6px; height:6px; border-radius:50%; }
  .badge.red { background:var(--red-bg); color:var(--red-text); border-color:var(--red-border); }
  .badge.red .dot { background:var(--red-dot); }
  .badge.amber { background:var(--amber-bg); color:var(--amber-text); border-color:var(--amber-border); }
  .badge.amber .dot { background:var(--amber-dot); }
  .badge.green { background:var(--green-bg); color:var(--green-text); border-color:var(--green-border); }
  .badge.green .dot { background:var(--green-dot); }
  .badge.blue { background:var(--blue-bg); color:var(--blue-text); border-color:var(--blue-border); }
  .badge.blue .dot { background:var(--blue-dot); }
  .badge.neutral { background:#F2F4F3; color:var(--ink-soft); border-color:var(--border); }
  .badge.neutral .dot { background:var(--slate); }

  /* ---------- AI decision panel ---------- */
  .decision-panel {
    border-radius: var(--radius-lg); border:1px solid var(--border); background:var(--surface);
    box-shadow: var(--shadow-card); margin-top:20px; overflow:hidden; border-left: 5px solid var(--slate);
  }
  .decision-panel.red { border-left-color: var(--red-dot); }
  .decision-panel.amber { border-left-color: var(--amber-dot); }
  .decision-panel.green { border-left-color: var(--green-dot); }
  .decision-panel.blue { border-left-color: var(--blue-dot); }
  .decision-head { padding: 20px 24px 16px; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; border-bottom:1px solid var(--border-soft); }
  .decision-head .dh-left .ai-tag { font-size:11.5px; font-weight:700; color:var(--brand-700); letter-spacing:.2px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .decision-head .dh-left h3 { font-size:19px; margin:0; font-weight:800; letter-spacing:-0.2px; }
  .decision-body { padding: 18px 24px 22px; }

  .metrics-grid { display:flex; gap:10px; margin-bottom:18px; }
  .metric { flex:1; padding:12px 14px; border:1px solid var(--border-soft); border-radius:var(--radius-md); background:var(--canvas); }
  .metric .mlabel { font-size:11px; color:var(--slate); font-weight:700; }
  .metric .mvalue { font-size:15px; font-weight:700; margin-top:3px; color:var(--ink); }

  .block { margin-bottom:16px; }
  .block .block-label { font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .reasoning-box {
    background: var(--brand-50); border:1px solid var(--brand-100); color:var(--ink-soft); padding:13px 15px;
    border-radius:var(--radius-md); font-size:14px; line-height:1.55;
  }
  .clarify-box {
    background: var(--amber-bg); border:1px solid var(--amber-border); color:var(--amber-text); padding:13px 15px;
    border-radius:var(--radius-md); font-size:14px; font-weight:600;
  }
  .next-action-box { display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--ink-soft); }

  /* ---------- Source / policy cards ---------- */
  .source-grid { display:flex; flex-direction:column; gap:8px; }
  .source-card { border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:#fff; }
  .source-card summary {
    list-style:none; cursor:pointer; padding:11px 14px; display:flex; align-items:center; gap:10px; font-size:13.5px;
  }
  .source-card summary::-webkit-details-marker { display:none; }
  .source-card summary .sc-id {
    font-size:11px; font-weight:800; color:var(--brand-700); background:var(--brand-100); padding:3px 8px; border-radius:6px; flex-shrink:0;
  }
  .source-card summary .sc-title { font-weight:700; color:var(--ink); flex:1; }
  .source-card summary .chev { color:var(--slate); transition: transform .15s ease; }
  .source-card[open] summary .chev { transform: rotate(90deg); }
  .source-card .sc-content { padding: 0 14px 14px 14px; font-size:13.5px; color:var(--ink-soft); line-height:1.55; border-top:1px solid var(--border-soft); margin-top:2px; padding-top:10px;}
  .no-source { font-size:13.5px; color:var(--slate); background:var(--canvas); border:1px dashed var(--border); border-radius:var(--radius-md); padding:12px 14px; }

  /* ---------- Ticket stub ---------- */
  .ticket-stub {
    margin-top:6px; border:1.5px dashed var(--brand-500); border-radius:var(--radius-md); background: var(--brand-50);
    padding: 16px 18px;
  }
  .ticket-stub .ts-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .ticket-stub .ts-head .ts-title { font-weight:700; font-size:13.5px; color:var(--brand-700); display:flex; align-items:center; gap:7px;}
  .ticket-stub .ts-id { font-size:12.5px; font-weight:800; }
  .ticket-fields { display:grid; grid-template-columns:1fr 1fr; gap:9px 20px; margin-bottom:14px; }
  .ticket-fields .tf { font-size:13px; }
  .ticket-fields .tf .k { color:var(--slate); font-size:11.5px; font-weight:600; }
  .ticket-fields .tf .v { color:var(--ink); font-weight:600; margin-top:1px; }

  hr.divider { border:none; border-top:1px solid var(--border); margin:24px 0; }

  .principle-cols { display:flex; gap:12px; }
  .principle { flex:1; padding:16px 18px; border-radius:var(--radius-md); font-size:13.5px; border:1px solid; }
  .principle .p-head { display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:5px; font-size:13.5px; }
  .principle.blue { background:var(--blue-bg); color:var(--blue-text); border-color:var(--blue-border);}
  .principle.amber { background:var(--amber-bg); color:var(--amber-text); border-color:var(--amber-border);}
  .principle.red { background:var(--red-bg); color:var(--red-text); border-color:var(--red-border);}

  /* ---------- Tables ---------- */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; box-shadow: var(--shadow-card); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th {
    text-align:left; padding:12px 16px; background: var(--canvas); color:var(--slate); font-weight:700; font-size:11.5px;
    border-bottom:1px solid var(--border);
  }
  tbody td { padding:12px 16px; border-bottom:1px solid var(--border-soft); color:var(--ink-soft); vertical-align:top; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover td { background: var(--brand-50); }
  td.id-cell, td.mono { font-family: "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size:12.5px; color:var(--ink); font-weight:700; }
  .table-empty { padding: 40px 20px; text-align:center; color:var(--slate); }

  /* ---------- Knowledge base grid ---------- */
  .kb-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .kb-card { border:1px solid var(--border); border-radius:var(--radius-md); background:#fff; padding:15px 16px; box-shadow: var(--shadow-card); }
  .kb-card .kb-id { font-size:11px; font-weight:800; color:var(--brand-700); background:var(--brand-100); padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:8px; }
  .kb-card h4 { margin:0 0 6px; font-size:14.5px; font-weight:700; }
  .kb-card p { margin:0; font-size:13px; color:var(--ink-soft); line-height:1.55; }

  .toast {
    position:fixed; bottom:24px; right:24px; background: var(--brand-950); color:#fff; padding:13px 20px;
    border-radius:var(--radius-md); font-size:13.5px; font-weight:600; opacity:0; transform:translateY(10px); transition:all .25s ease;
    pointer-events:none; z-index:50; display:flex; align-items:center; gap:8px; box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .toast.show { opacity:1; transform:translateY(0); }

  @media (max-width: 900px) {
    .layout { flex-direction:column; }
    .sidebar { width:100%; min-height:auto; position:static; padding:12px 14px; }
    .nav { flex-direction:row; overflow-x:auto; }
    .nav button { white-space:nowrap; }
    .sidebar-divider, .sidebar-note { display:none; }
    .main { padding:22px 16px; }
    .stat-row, .metrics-grid, .principle-cols, .ticket-fields, .kb-grid { flex-direction:column; grid-template-columns:1fr; }
  }

  /* ---------- Decision pipeline (4 outcomes) ---------- */
  .pipeline { border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; background:var(--brand-50); }
  .pipe-steps { display:flex; align-items:stretch; gap:8px; flex-wrap:wrap; }
  .pipe-step { flex:1; min-width:150px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:8px 10px; }
  .pipe-step .ps-k { font-size:10.5px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:.4px; }
  .pipe-step .ps-v { font-size:13px; font-weight:650; color:var(--ink); margin-top:2px; }
  .pipe-arrow { display:flex; align-items:center; color:var(--slate); }
  .lane-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .lane { border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 8px; text-align:center; background:var(--surface); opacity:.45; }
  .lane .lane-label { font-size:12.5px; font-weight:800; color:var(--slate); }
  .lane .lane-sub { font-size:10.5px; font-weight:600; color:var(--slate); margin-top:1px; }
  .lane.on { opacity:1; box-shadow:0 0 0 2px rgba(0,0,0,.03); }
  .lane.on.green { background:var(--green-bg); border-color:var(--green-border); }
  .lane.on.green .lane-label, .lane.on.green .lane-sub { color:var(--green-text); }
  .lane.on.blue { background:var(--blue-bg); border-color:var(--blue-border); }
  .lane.on.blue .lane-label, .lane.on.blue .lane-sub { color:var(--blue-text); }
  .lane.on.amber { background:var(--amber-bg); border-color:var(--amber-border); }
  .lane.on.amber .lane-label, .lane.on.amber .lane-sub { color:var(--amber-text); }
  .lane.on.red { background:var(--red-bg); border-color:var(--red-border); }
  .lane.on.red .lane-label, .lane.on.red .lane-sub { color:var(--red-text); }
  .no-ticket-box { border:1px dashed var(--border); border-radius:var(--radius-sm); padding:11px 13px; font-size:13px; color:var(--ink-soft); background:var(--brand-50); }
  .ticket-stub.conditional { border-style:dashed; background:var(--amber-bg); border-color:var(--amber-border); }
  @media (max-width:760px) { .lane-row { grid-template-columns:repeat(2,1fr); } .pipe-arrow { display:none; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="brandmark">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
      <path d="M16 2 L29 8 V17 C29 24.5 23.3 29.3 16 31 C8.7 29.3 3 24.5 3 17 V8 Z" fill="#0E8560"/>
      <path d="M11 16.5 L14.5 20 L21.5 12" stroke="#06211A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="wordmark">Veridian<small>IT Assist</small></div>
  </div>
  <div class="topbar-spacer"></div>
  <div class="env-pill">Prototype build · Assignment 2</div>
  <div class="user-chip">
    <div class="avatar">IT</div>
    <span>Service Desk</span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="nav" id="nav">
      <button data-page="Agent" class="active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L15 8 L21.5 9 L17 13.7 L18 20.5 L12 17.2 L6 20.5 L7 13.7 L2.5 9 L9 8 Z"/></svg>
        Agent
      </button>
      <button data-page="Ticket Queue">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M13 6v2M13 16v2M13 11v2"/></svg>
        Ticket Queue
      </button>
      <button data-page="Knowledge Base">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        Knowledge Base
      </button>
      <button data-page="Audit Trail">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
        Audit Trail
      </button>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-note">
      <div class="t">Scope note</div>
      <p>Business knowledge is restricted to the supplied policy pack (KB-01–10, AMP). The agent will not answer outside it.</p>

        policy_finding: "No supplied policy authorizes IT to grant admin access to the finance reporting server. Historical ticket TK-1050 shows such a request rejected for missing business justification — precedent, not policy.",
        authority_check: "A justification has been offered, but it still needs the system owner and Security to authorize. The agent cannot grant privileged access under any circumstance.",
        reason: "There's a stated business case, so the request is actionable — but privileged access on a finance system is a high-risk grant that must be authorized by named humans.",
        next_action: "Escalate to IT Security and the system owner with the stated justification, the exact permissions needed and a defined end date. Prefer time-boxed, least-privilege access over standing admin.",
        status: "Escalated for authorization"
      });
    }
    return decide({
      outcome: "CLARIFY", intent: "Privileged access request (unjustified)", decision: "Require justification before anything is raised",
      risk: "High", sources: [],
      policy_finding: "No supplied policy grants IT the authority to issue admin access to the finance reporting server. TK-1050 was rejected for exactly this gap.",
      authority_check: "Urgency is not authorization. Without a business justification and a named approver there is nothing an IT queue can legitimately action.",
      reason: "Raising an actionable ticket for unjustified privileged access would create pressure to grant it. Policy precedent says the opposite — the gap is closed before, not after, the ticket.",
      next_action: "Collect the business justification, the specific permissions needed, the duration, and the approving system/data owner. Month-end pressure doesn't change the requirement.",
      status: "Awaiting justification",
      clarification: "What specifically do you need to do on the finance reporting server, who owns that system, and have they approved it? Admin rights need a business justification and owner sign-off — read-only or time-boxed access is often enough, and much faster."
    });
  }

  /* ---- Genuinely vague ---- */
  return decide({
    outcome: "CLARIFY", intent: "Unclear — intent not determinable", decision: "Ask what's affected",
    risk: "Medium", sources: [],
    policy_finding: "No policy can be selected — matching one now would mean guessing which system is involved.",
    authority_check: "No authority check is possible without a defined request.",
    reason: "The request doesn't identify a system, device or service. Creating a ticket here would just push an unanswerable question into the queue.",
    next_action: "Ask which system is affected and what the employee is seeing, then re-run the assessment.",
    status: "Awaiting information",
    clarification: "Sure — what isn't working? Your laptop, VPN, printer, email, or a specific piece of software? And what happens when you try, including any error message."
  });
}

function wfhEquipment(t, has) {
  const approved = has("approved", "manager signed", "sign-off done", "finance approved", "got approval", "already approved");
  if (approved) {
    return decide({
      outcome: "ROUTE", intent: "WFH equipment — shipping after approval", decision: "Route to IT for shipping",
      risk: "Low", sources: ["KB-10"], owner: "IT Service Desk (logistics)",
      policy_finding: "KB-10 — employees remote more than 3 days/week are eligible for a one-time home-office allowance. Manager sign-off and Finance processing come first; IT handles shipping once approved.",
      authority_check: "Approval is reported as complete, which puts this at the stage where IT is the correct owner.",
      reason: "The approval gates are behind it, so what remains is the shipping request — actual IT work.",
      next_action: "Verify the approval record, confirm the delivery address, and raise the equipment shipping request.",
      status: "Ready for IT fulfilment"
    });
  }

    authority_check: "IT has no role at this stage. Manager and Finance hold the decision, so an IT ticket would sit idle waiting on them.",
    reason: "The employee meets the stated eligibility bar, but the request is at the approval stage, not the fulfilment stage. Telling them the path now is faster than parking a ticket.",
    next_action: "Get manager sign-off for the one-time allowance, then let Finance process it. Come back once approved and IT will arrange shipping.",
    status: "Employee action — seek approval",
    escalation_path: { trigger: "Manager and Finance approval obtained", becomes: "Route to IT for equipment shipping" }

}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------------- Badge / risk helpers ---------------- */
function tone(outcomeKey) {
  return (OUTCOMES[outcomeKey] || OUTCOMES.CLARIFY).tone;
}
function outcomeBadge(outcomeKey) {
  const o = OUTCOMES[outcomeKey] || OUTCOMES.CLARIFY;
  return `<span class="badge ${o.tone}"><span class="dot"></span>${o.label}${o.ticket ? " \u00b7 ticket" : " \u00b7 no ticket"}</span>`;
}
function riskBadge(risk) {
  const cls = risk === "High" ? "red" : (risk === "Medium" ? "amber" : "green");
  return `<span class="badge ${cls}"><span class="dot"></span>${escapeHtml(risk)} risk</span>`;
}
function decisionBadge(decision, outcomeKey) {
  const cls = tone(outcomeKey);
  return `<span class="badge ${cls}"><span class="dot"></span>${escapeHtml(decision)}</span>`;
}
function statusBadge(status) {
  const s = status.toLowerCase();
  let cls = "neutral";
  if (s.includes("resolved") || s.includes("ready") || s.includes("approved")) cls = "green";
  else if (s.includes("escalat") || s.includes("rejected")) cls = "red";
  else if (s.includes("pending") || s.includes("awaiting") || s.includes("review") || s.includes("required")) cls = "amber";
  else if (s.includes("active") || s.includes("progress") || s.includes("investigating")) cls = "blue";
  return `<span class="badge ${cls}"><span class="dot"></span>${escapeHtml(status)}</span>`;
}
function typeBadge(t) {
  return t === "Generated"
    ? `<span class="badge blue"><span class="dot"></span>Generated</span>`
    : `<span class="badge neutral"><span class="dot"></span>Supplied</span>`;
}

function auditEvent(text, result, requestId) {
  state.audit.unshift({
    timestamp: new Date().toISOString().slice(0,19).replace("T"," "),
    request_id: requestId || "AD-HOC",
    request: text,
    intent: result.intent,
    decision: result.decision,
    outcome: result.outcome,
    ticket_required: result.ticket_required,
    risk: result.risk,
    sources: (result.sources && result.sources.length) ? result.sources.join(", ") : "None",
    status: result.status
  });
}

      <div class="stat-card"><div class="stat-label">${ICONS.ticket} Total tickets</div><div class="stat-value">${rows.length}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.clock} Active</div><div class="stat-value">${active}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.shield} Closed</div><div class="stat-value">${closed}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.spark} Generated this session</div><div class="stat-value">${state.generated_tickets.length}</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Ticket</th><th>Employee</th><th>Issue</th><th>Status</th><th>Source</th></tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="id-cell">${escapeHtml(r.ID)}</td>
            <td>${escapeHtml(r.Employee)}</td>
            <td>${escapeHtml(r.Issue)}</td>
            <td>${statusBadge(r.Status)}</td>
            <td>${typeBadge(r.Type)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

/* ---------------- Knowledge Base page ---------------- */
function renderKnowledgeBasePage() {
  const el = document.getElementById("page-KnowledgeBase");
  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Policy pack</div>
      <h1>Knowledge base</h1>
      <p>The complete set of policies the agent is allowed to reason from — ${policies.length} documents, nothing outside this pack.</p>
    </div>
    <div class="panel" style="padding-bottom:18px;">
      <label class="fieldLabel" style="margin-top:0;">Search policies</label>
      <input type="text" id="kbSearch" placeholder="Search by policy ID, title, or content…">
    </div>
    <div class="kb-grid" id="kbResults"></div>
  `;
  const renderResults = (query) => {
    const q = (query || "").toLowerCase();
    const results = policies.filter(p => !q || (p.id + " " + p.title + " " + p.content).toLowerCase().includes(q));
    document.getElementById("kbResults").innerHTML = results.map(p => `
      <div class="kb-card">
        <span class="kb-id">${p.id}</span>
        <h4>${escapeHtml(p.title)}</h4>
        <p>${escapeHtml(p.content)}</p>
      </div>
    `).join("") || `<div class="table-empty" style="grid-column:1/-1;">No policies match “${escapeHtml(query)}”.</div>`;
  };
  renderResults("");
  document.getElementById("kbSearch").addEventListener("input", (e) => renderResults(e.target.value));
}

/* ---------------- Audit Trail page ---------------- */
function renderAuditTrailPage() {
  const el = document.getElementById("page-AuditTrail");
  const escalations = state.audit.filter(a => a.outcome === "ESCALATE").length;
  const clarifications = state.audit.filter(a => a.outcome === "CLARIFY").length;
  const resolved = state.audit.filter(a => a.outcome === "RESOLVE").length;

  let body;
  if (state.audit.length) {
    body = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Time</th><th>Request</th><th>Employee text</th><th>Intent</th><th>Outcome</th><th>Ticket</th><th>Sources</th><th>Status</th></tr></thead>
          <tbody>
            ${state.audit.map(a => `<tr>
              <td class="mono">${escapeHtml(a.timestamp)}</td>
              <td class="id-cell">${escapeHtml(a.request_id)}</td>
              <td style="max-width:220px;">${escapeHtml(a.request)}</td>
              <td>${escapeHtml(a.intent)}</td>
              <td>${decisionBadge(OUTCOMES[a.outcome].label + " \u2014 " + a.decision, a.outcome)}</td>
              <td>${a.ticket_required ? "Yes" : "No"}</td>
              <td class="mono">${escapeHtml(a.sources)}</td>
              <td>${statusBadge(a.status)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  } else {
    body = `<div class="table-wrap"><div class="table-empty">No interactions recorded yet. Process a request from the Agent page to populate this log.</div></div>`;
  }

  el.innerHTML = `
    <div class="page-head">
      <div class="eyebrow">Governance</div>
      <h1>Audit trail</h1>
      <p>Every decision the agent made this session, in order, with the policy sources it relied on.</p>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">${ICONS.spark} Interactions</div><div class="stat-value">${state.audit.length}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.shield} Security escalations</div><div class="stat-value">${escalations}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.clock} Clarifications asked</div><div class="stat-value">${clarifications}</div></div>
      <div class="stat-card"><div class="stat-label">${ICONS.arrow} Resolved without a ticket</div><div class="stat-value">${resolved}</div></div>
    </div>

    ${body}
  `;
}

/* ---------------- Init ---------------- */
renderPage();
</script>
</body>
</html>
